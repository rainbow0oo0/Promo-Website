<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. SEO 메타태그 -->
    <title>hometest | 서비스 홍보</title>
    <meta name="description" content="네이버 검색 결과 요약 문구에 표시될 서비스 설명입니다.">
    <meta name="keywords" content="홍보, 이벤트, 테스트">
    <meta name="author" content="rainbow0oo0">
    
    <!-- 2. 네이버 소유확인 태그 -->
    <meta name="naver-site-verification" content="여기에_발급받은_네이버_소유확인_코드_입력" />

    <!-- 3. Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="hometest | 서비스 홍보">
    <meta property="og:description" content="카톡이나 메신저로 링크 공유 시 보일 요약 설명입니다.">
    <meta property="og:image" content="https://rainbow0oo0.github.io/promowebsite/og-image.png">
    <meta property="og:url" content="https://rainbow0oo0.github.io/promowebsite/">

    <!-- 분리한 external CSS 연결 -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 외부 header.html이 들어올 위치 -->
    <div id="header-container"></div>

    <main>
        <section class="hero">
            <h1>비즈니스를 변화시킬<br>가장 빠르고 명확한 한 걸음</h1>
            <p>단 몇 분 만에 경험하는 새로운 서비스. 지금 바로 오픈 이벤트를 확인해보세요.</p>
            <button class="cta-btn" onclick="handleCTA()">지금 시작하기</button>
        </section>

        <section class="features">
            <div class="feature-card">
                <h3>🚀 압도적인 속도</h3>
                <p>복잡한 수속 없이 즉각적인 서비스 적용과 빠르게 눈에 보이는 결과를 제공합니다.</p>
            </div>
            <div class="feature-card">
                <h3>🔒 신뢰할 수 있는 품질</h3>
                <p>전문적인 프로세스를 통해 안정적인 품질보증과 후속 케어를 지원합니다.</p>
            </div>
            <div class="feature-card">
                <h3>💡 직관적인 경험</h3>
                <p>별도의 공부 없이 누구나 간편하게 사용할 수 있도록 최적화되어 있습니다.</p>
            </div>
        </section>
    </main>

    <!-- 외부 footer.html이 들어올 위치 -->
    <div id="footer-container"></div>

    <script>
        // 외부 Component 불러오기 함수
        async function loadComponent(elementId, filePath) {
            try {
                const response = await fetch(filePath);
                if (response.ok) {
                    const content = await response.text();
                    document.getElementById(elementId).innerHTML = content;
                } else {
                    console.error(`Failed to load ${filePath}`);
                }
            } catch (error) {
                console.error(`Error loading ${filePath}:`, error);
            }
        }

        // DOM이 로드된 후 헤더와 푸터 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            loadComponent('header-container', 'components/header.html');
            loadComponent('footer-container', 'components/footer.html');
        });

        function handleCTA() {
            alert('개발중입니다!');
        }

        // 개인정보처리방침 모달 제어 함수
        function openPrivacyModal() {
            const modal = document.getElementById('privacyModal');
            if (modal) modal.style.display = 'flex';
        }

        function closePrivacyModal() {
            const modal = document.getElementById('privacyModal');
            if (modal) modal.style.display = 'none';
        }

        // 모달 바깥 클릭 시 닫기
        window.addEventListener('click', function(event) {
            const modal = document.getElementById('privacyModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
